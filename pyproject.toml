[project]
name = "clinical-bigdata-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juan José Lopera Londoño", email = "jjlopera.tech@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dask[distributed]>=2026.8.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.9.1",
    "ucimlrepo>=0.0.7",
]

[project.scripts]
clinical-bigdata-pipeline = "clinical_bigdata_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]
